name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongodb:
        image: mongo:5
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create test environment file
      run: |
        cat > config.env << EOF
        POSTGRES_URI=postgresql://postgres:postgres@localhost:5432/test_db
        ATLAS_URI_LOGS=mongodb://localhost:27017/test_logs
        ORS_API_KEY=${{ secrets.ORS_API_KEY }}
        EOF

    - name: Set up database schema
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -f schema.sql
      env:
        PGPASSWORD: postgres

    - name: Run linting (if eslint config exists)
      run: |
        if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "package.json" ] && grep -q "eslint" package.json; then
          npm run lint
        else
          echo "No ESLint configuration found, skipping linting"
        fi
      continue-on-error: true

    - name: Run tests
      run: npm run mocha
      env:
        NODE_ENV: test
        POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run basic server test
      run: npm test
      env:
        NODE_ENV: test
        POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/test_db

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate

    - name: Check for outdated packages
      run: npm outdated
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, security]

    services:
      mongodb:
        image: mongo:5
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check if server starts successfully
      run: |
        timeout 30s node server.js &
        sleep 10
        curl -f http://localhost:3000/app/ || exit 1
      env:
        NODE_ENV: production
        POSTGRES_URI: postgresql://dummy:dummy@localhost:5432/dummy
        ATLAS_URI_LOGS: mongodb://localhost:27017/test_logs
