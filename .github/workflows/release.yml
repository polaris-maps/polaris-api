name: Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run mocha

    - name: Create release notes
      run: |
        echo "# Release Notes" > release-notes.md
        echo "" >> release-notes.md
        echo "## Changes in this release:" >> release-notes.md
        git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> release-notes.md

    - name: Upload release notes
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: release-notes.md

  docker-build:
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Dockerfile
      run: |
        cat > Dockerfile << 'EOF'
        FROM node:18-alpine
        
        WORKDIR /app
        
        # Copy package files
        COPY package*.json ./
        
        # Install dependencies
        RUN npm ci --only=production
        
        # Copy source code
        COPY . .
        
        # Expose port
        EXPOSE 3000
        
        # Create non-root user
        RUN addgroup -g 1001 -S nodejs
        RUN adduser -S nodejs -u 1001
        
        # Change ownership of the app directory
        RUN chown -R nodejs:nodejs /app
        USER nodejs
        
        # Start the application
        CMD ["node", "server.js"]
        EOF

    - name: Build Docker image
      run: |
        docker build -t polaris-api:${{ github.ref_name }} .
        docker build -t polaris-api:latest .

    # Uncomment and configure these steps if you want to push to a registry
